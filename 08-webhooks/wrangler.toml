name = "flare-plus-webhooks"
main = "src/index.js"
compatibility_date = "2023-12-01"

# KV 命名空间 - 存储 webhook 配置和日志
[[kv_namespaces]]
binding = "WEBHOOKS_KV"
id = "your_kv_namespace_id"

# D1 数据库 - 存储 webhook 事件和统计
[[d1_databases]]
binding = "DB"
database_name = "webhooks-db"
database_id = "your_database_id"

# Queue 绑定 - 异步处理 webhook
[[queues.producers]]
binding = "WEBHOOK_QUEUE"
queue = "webhook-events"

[[queues.consumers]]
queue = "webhook-events"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 3
dead_letter_queue = "webhook-dlq"

# 环境变量
[vars]
ENVIRONMENT = "development"
MAX_PAYLOAD_SIZE = "1048576"
RATE_LIMIT_REQUESTS = "100"
RATE_LIMIT_WINDOW = "60"
SIGNATURE_HEADER = "X-Webhook-Signature"

# GitHub Webhook 配置
GITHUB_WEBHOOK_SECRET = "your_github_secret"
STRIPE_WEBHOOK_SECRET = "your_stripe_secret"
SLACK_WEBHOOK_SECRET = "your_slack_secret"

# 生产环境
[env.production]
name = "flare-plus-webhooks-prod"

[env.production.vars]
ENVIRONMENT = "production"
MAX_PAYLOAD_SIZE = "2097152"
RATE_LIMIT_REQUESTS = "1000"
RATE_LIMIT_WINDOW = "60"

# 资源限制
[limits]
cpu_ms = 200
