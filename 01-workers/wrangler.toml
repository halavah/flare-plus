name = "flare-plus-workers"
main = "src/index.js"
compatibility_date = "2023-12-01"
compatibility_flags = ["nodejs_compat"]

# 基础配置
[vars]
# 应用配置
VERSION = "1.0.0"
ENVIRONMENT = "development"
DEBUG = "true"

# Cloudflare 配置
CLOUDFLARE_ACCOUNT_ID = "${CLOUDFLARE_ACCOUNT_ID}"

# 数据库配置
D1_DATABASE_ID = "${D1_DATABASE_ID}"
D1_DATABASE_NAME = "flare-vmail"

# 应用配置
EMAIL_DOMAIN = "${EMAIL_DOMAIN}"
COOKIES_SECRET = "${COOKIES_SECRET}"

# JWT 配置
JWT_EXPIRES_IN = "24h"
REFRESH_TOKEN_EXPIRES_IN = "7d"

# CORS 配置
CORS_ORIGINS = "*"
CORS_METHODS = "GET,POST,PUT,DELETE,OPTIONS"
CORS_HEADERS = "Content-Type,Authorization,X-Requested-With"

# 缓存配置
CACHE_TTL = "300"
CACHE_MAX_SIZE = "100"

# 日志配置
LOG_LEVEL = "info"
LOG_FORMAT = "json"

# 功能开关
ENABLE_ANALYTICS = "false"
ENABLE_METRICS = "true"
ENABLE_COMPRESSION = "true"
ENABLE_CACHE = "true"
ENABLE_RATE_LIMIT = "true"
ENABLE_CORS = "true"
ENABLE_SECURITY_HEADERS = "true"

# 安全配置
MAX_REQUEST_SIZE = "10485760"

# 开发配置
MOCK_DATA = "true"
BYPASS_AUTH = "false"

# Turnstile 配置
TURNSTILE_SITE_KEY = "${TURNSTILE_SITE_KEY}"
TURNSTILE_SECRET_KEY = "${TURNSTILE_SECRET_KEY}"

# D1 数据库绑定
[[d1_databases]]
binding = "DB"
database_name = "flare-vmail"
database_id = "${D1_DATABASE_ID}"

# KV 命名空间绑定
[[kv_namespaces]]
binding = "SESSIONS_KV"
id = "${SESSIONS_KV_ID}"
preview_id = "${SESSIONS_KV_PREVIEW_ID}"

[[kv_namespaces]]
binding = "BLACKLIST_KV"
id = "${BLACKLIST_KV_ID}"
preview_id = "${BLACKLIST_KV_PREVIEW_ID}"

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "${RATE_LIMIT_KV_ID}"
preview_id = "${RATE_LIMIT_KV_PREVIEW_ID}"

[[kv_namespaces]]
binding = "TOKEN_BUCKET_KV"
id = "${TOKEN_BUCKET_KV_ID}"
preview_id = "${TOKEN_BUCKET_KV_PREVIEW_ID}"

[[kv_namespaces]]
binding = "CACHE_KV"
id = "${CACHE_KV_ID}"
preview_id = "${CACHE_KV_PREVIEW_ID}"

# R2 存储绑定（可选）
# [[r2_buckets]]
# binding = "R2_BUCKET"
# bucket_name = "your-r2-bucket-name"

# Durable Objects（可选）
# [[durable_objects.bindings]]
# name = "DURABLE_OBJECT"
# class_name = "DurableObjectClass"

# 队列（可选）
# [[queues.producers]]
# binding = "QUEUE"
# queue = "my-queue"

# 生产环境配置
[env.production]
name = "flare-plus-workers-prod"

[env.production.vars]
ENVIRONMENT = "production"
DEBUG = "false"
MOCK_DATA = "false"
BYPASS_AUTH = "false"
LOG_LEVEL = "warn"

# 开发环境配置
[env.development]
name = "flare-plus-workers-dev"

[env.development.vars]
ENVIRONMENT = "development"
DEBUG = "true"
MOCK_DATA = "true"
BYPASS_AUTH = "false"
LOG_LEVEL = "debug"

# 测试环境配置
[env.staging]
name = "flare-plus-workers-staging"

[env.staging.vars]
ENVIRONMENT = "staging"
DEBUG = "true"
MOCK_DATA = "false"
BYPASS_AUTH = "false"
LOG_LEVEL = "info"

# 资源限制
[limits]
cpu_ms = 50

# 触发器配置
[triggers]
# 定时任务
crons = [
    # 每天午夜执行清理任务
    "0 0 * * *"
]

# 路由（用于自定义域名）
# [routes]
# pattern = "api.yourdomain.com/*"
# zone_name = "yourdomain.com"

# Workers Analytics Engine（可选）
# [[analytics_engine_datasets]]
# binding = "ANALYTICS"

# 静态资源（可选）
# [site]
# bucket = "./public"
# entry-point = "workers-site"

# 定时任务配置
# [env.production.triggers]
# crons = ["0 0 * * *"]